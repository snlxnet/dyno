<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test outer shell</title>
    <style>
      iframe {
        width: 100%;
        height: 80vh;
        border: 1px solid black;
        border-radius: 1em;
      }
    </style>
  </head>
  <body>
    <iframe src="/" id="inner">
    </iframe>

    File
    <input type="file" id="binfile">

    <script>
      binfile.oninput = async () => {
        const f = binfile.files[0]

        if (!f) {
          return
        }

        if (f.name.endsWith(".typ")) {
          // todo
          return
        }

        const bytes = await f.bytes()
        inner.contentWindow.postMessage({type: "file", name: f.name, bytes})
      }
    </script>
  </body>
</html>
