---
name: Deploy to pages
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: install typst
        run: sudo snap install typst
      - name: check out repo code
        uses: actions/checkout@v5
      - name: setup pages
        uses: actions/configure-pages@v5
      - name: build
        run: |
          ./deps.sh
          cp src/* .
          rm README.md flake.* deps.sh
          mv webdemo.html index.html
          mkdir api
          echo '["noto emoji.ttf","jetbrains mono.ttf"]' > api/fonts
          typst compile --format=html --features=html app.typ --font-path=.
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
