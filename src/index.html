<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dyno | snlx.net</title>
    <meta
      name="description"
      content="A Typst runtime with inputs"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100svh;
        border: none;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <iframe src="/engine" id="inner" allow-top-navigation>
    </iframe>

    <script>
      const filename = new URLSearchParams(location.search).get("root") || "main.typ"
      const events = new EventSource("/api/watch")

      window.addEventListener("message", ({data}) => {
        const { err, status } = data
        if (status === "listening") {
          main()
        }
        document.body.style.filter = ""
        if (!err.length) return
        console.error(err)
        document.body.style.filter = "blur(0.6em)"
        document.body.style.background = "#ff8383"
      })

      async function main() {
        await loadFonts()
        await loadTyp()

        events.addEventListener("file-change", (event) => {
          const data = JSON.parse(event.data)
          if (data.file === filename.replace(/^\//, "")) {
            loadTyp()
          }
        })
      }

      async function loadFonts() {
        const fonts = JSON.parse(await (await fetch("/api/fonts")).text())
        fonts.forEach((font) => {
          inner.contentWindow.postMessage({
            method: "font",
            name: font.split(".")[0],
            url: "/" + font,
          })
        })
      }

      async function loadTyp() {
        const main = await fetch("/" + filename, { cache: "no-cache" })
        const bytes = await main.arrayBuffer()
        inner.contentWindow.postMessage({method: "setMain", name: filename, bytes})
        inner.contentWindow.postMessage({method: "render"})
      }
    </script>
  </body>
</html>
