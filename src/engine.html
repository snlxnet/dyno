<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="darkreader-lock" />
    <link rel="stylesheet" href="/yap.css" />
    <title>dyno engine | snlx.net</title>
    <meta
      name="description"
      content="The engine itself"
    />
    <style>
      .dyno {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .dyno * {
        width: 100%;
        height: 100%;
        resize: none;
        overflow: hidden;
        border: none;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        font-size-adjust: cap-height 0.5;
        color: transparent;
        background: transparent;
        display: flex;
        appearance: none;
      }

      #root svg {
        max-width: 100%;
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input::selection {
        color: transparent;
        background: transparent;
      }
    </style>
  </head>
  <body class="book-mode disable-yap">
    <div id="sidebar">
      <main id="notes"></main>
      <div id="controls">
        <button id="prev">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-left-icon lucide-arrow-left"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
        </button>

        <span id="timer"></span>

        <div>
          <button id="full">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-fullscreen-icon lucide-fullscreen"
            >
              <path d="M3 7V5a2 2 0 0 1 2-2h2" />
              <path d="M17 3h2a2 2 0 0 1 2 2v2" />
              <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
              <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
              <rect width="10" height="8" x="7" y="8" rx="1" />
            </svg>
          </button>
          <button id="next">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-arrow-right-icon lucide-arrow-right"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="root">
      <p style="color: #cdd6f4" id="loader">Loading dyno...</p>
    </div>

    <script src="yap.js"></script>
    <script src="main.js" type="module"></script>
  </body>
</html>
