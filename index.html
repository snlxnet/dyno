<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dyno | snlx.net</title>
    <meta
      name="description"
      content="A dynamic runtime for typst"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100vh;
        border: none;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <iframe src="/engine" id="inner">
    </iframe>

    <script>
      const filename = new URLSearchParams(location.search).get("root") || "main.typ"

      inner.onload = main
      window.addEventListener("message", ({data}) => {
        const { err } = data
        if (!err) return
        console.error(`${err.line}:${err.column} ${err.message}\nHints: ${err.hints}`)
      })

      async function main() {
        const fontNames = {
          "NewCMMath-Regular.otf": "New Computer Modern Math",
          "LibertinusSerif-Regular.otf": "Liberation Serif",
          "DejaVuSansMono.ttf": "DejaVu Sans Mono",
        }
        await Promise.all(Object.entries(fontNames).map(([f, name]) => {
          const url = `https://cdn.jsdelivr.net/npm/@typst-wasm/fonts@1.0.0/dist/files/${f}`
          inner.contentWindow.postMessage({method: "font", name, url})
        }))

        inner.contentWindow.postMessage({method: "font", name: "Departure Mono", url: "/Departure Mono.otf"})

        const index = await fetch("/" + filename, { cache: "no-cache" })
        const bytes = await index.bytes()
        inner.contentWindow.postMessage({method: "setMain", name: "index.typ", bytes})
        inner.contentWindow.postMessage({method: "render"})
      }
    </script>
  </body>
</html>
